<html>
    <head>
        <title>
            formss
        </title>
    </head>
    <body>
        <h2>Students Registration</h2>
        <form>
            <label for="studentname">Student name:</label>
            <input type="text" id="studentname" name="studentname" required>

            <br>

            <label for="studentemail">Student email:</label>
            <input type="email" id="studentemail" name="studentemail" required>

            <br>

            <label for="studentpass">password:</label>
            <input type="password" id="studentpass" name="studentpass" required>

            <br>

            <label for="dob">Date of birth:</label>
            <input type="date" id="dob" name="dob" required>

            <br>

            <label for="phonenumber">phone number:</label>
            <input type="tel" id="phonenumber" name="phonenumber" required>

            <br>

            <label for="male">male</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="female">female</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="other">other</label>
            <input type="radio" id="other" name="gender" value="other">

            <br>

            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">Choose a course</option>
                <option value="Btech CSE">Btech CSE</option>
                <option value="BCA">BCA</option>
                <option value="BSC">BSC</option>
            </select>

            <br>

            <label for="HTML">HTML</label>
            <input type="checkbox" id="HTML" name="skill" value="HTML">

            <label for="CSS">CSS</label>
            <input type="checkbox" id="CSS" name="skill" value="CSS">

            <label for="PYTHON">Python</label>
            <input type="checkbox" id="PYTHON" name="skill" value="PYTHON">

            <br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" required></textarea>

            <br>

            <button type="submit">Submit</button>

            <br>

            <button type="reset">reset</button>
        </form>
    </body>
</html>
